<!-- Load Supabase SDK first -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your custom script -->
<script>
    // ================================================================
    // POPPY ESPORTS – Landing Page (Fixed)
    // ================================================================

    // 1. CONFIGURATION
    const SUPABASE_URL = 'https://ozfrhmbtgjquagxbinjv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96ZnJobWJ0Z2pxdWFneGJpbmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Mjg1NTQsImV4cCI6MjEwMTIwNDU1NH0.aUvqIJ4vyiWfgR96dscEFNL1xyoHeCtOUlZCRqN_YiI';

    // 2. INIT SUPABASE – use a unique name
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. STATE
    let isLogin = true;
    let signupData = {};
    let fetchedUidData = null;

    // 4. DOM ELEMENTS – add all your getElement calls here
    const authTitle = document.getElementById('authTitle');
    const authForm = document.getElementById('authForm');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authName = document.getElementById('authName');
    const authPhone = document.getElementById('authPhone');
    const authReferral = document.getElementById('authReferral');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authToggle = document.getElementById('authToggle');
    const authMessage = document.getElementById('authMessage');

    const step1Content = document.getElementById('step1Content');
    const step2Content = document.getElementById('step2Content');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const backToStep1 = document.getElementById('backToStep1');

    const ffUidInput = document.getElementById('ffUidInput');
    const fetchUidBtn = document.getElementById('fetchUidBtn');
    const verifyUidBtn = document.getElementById('verifyUidBtn');
    const ffPreviewContainer = document.getElementById('ffPreviewContainer');
    const previewClanName = document.getElementById('previewClanName');
    const previewClanId = document.getElementById('previewClanId');
    const previewCaptain = document.getElementById('previewCaptain');
    const previewCaptainLevel = document.getElementById('previewCaptainLevel');
    const previewRegion = document.getElementById('previewRegion');
    const uidMessage = document.getElementById('uidMessage');

    // Social links
    const telegramLink = document.getElementById('telegramLink');
    const discordLink = document.getElementById('discordLink');
    const youtubeLink = document.getElementById('youtubeLink');
    const instagramLink = document.getElementById('instagramLink');

    // 5. AUTH TOGGLE
    authToggle.addEventListener('click', () => {
        isLogin = !isLogin;
        if (isLogin) {
            authTitle.textContent = 'Login';
            authSubmitBtn.textContent = 'Login';
            authToggle.textContent = "Don't have an account? Sign Up";
            authName.style.display = 'none';
            authPhone.style.display = 'none';
            authReferral.style.display = 'none';
            step1Content.style.display = 'block';
            step2Content.style.display = 'none';
            step1.className = 'step active';
            step2.className = 'step';
        } else {
            authTitle.textContent = 'Sign Up';
            authSubmitBtn.textContent = 'Next';
            authToggle.textContent = "Already have an account? Login";
            authName.style.display = 'block';
            authPhone.style.display = 'block';
            authReferral.style.display = 'block';
            step1Content.style.display = 'block';
            step2Content.style.display = 'none';
            step1.className = 'step active';
            step2.className = 'step';
            // Reset verification state
            fetchedUidData = null;
            ffPreviewContainer.style.display = 'none';
            verifyUidBtn.disabled = true;
            uidMessage.textContent = '';
        }
        authMessage.textContent = '';
    });

    // 6. BACK TO STEP 1
    backToStep1.addEventListener('click', () => {
        step1Content.style.display = 'block';
        step2Content.style.display = 'none';
        step1.className = 'step active';
        step2.className = 'step';
        fetchedUidData = null;
        ffPreviewContainer.style.display = 'none';
        verifyUidBtn.disabled = true;
        uidMessage.textContent = '';
    });

    // 7. FORM SUBMIT (Step 1)
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isLogin) {
            // LOGIN
            const email = authEmail.value.trim();
            const password = authPassword.value;
            if (!email || !password) {
                authMessage.textContent = 'Email and password required.';
                return;
            }
            try {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                window.location.href = '/user';
            } catch (err) {
                authMessage.textContent = err.message;
            }
        } else {
            // SIGNUP – move to step 2
            const name = authName.value.trim();
            const phone = authPhone.value.trim();
            const email = authEmail.value.trim();
            const password = authPassword.value;
            const referral = authReferral.value.trim();

            if (!name || !phone || !email || !password) {
                authMessage.textContent = 'All fields are required.';
                return;
            }
            if (password.length < 6) {
                authMessage.textContent = 'Password must be at least 6 characters.';
                return;
            }

            signupData = { name, phone, email, password, referral };
            step1Content.style.display = 'none';
            step2Content.style.display = 'block';
            step1.className = 'step done';
            step2.className = 'step active';
            authMessage.textContent = '';
            uidMessage.textContent = '';
        }
    });

    // 8. FETCH UID DATA
    fetchUidBtn.addEventListener('click', async () => {
        const uid = ffUidInput.value.trim();
        if (!uid) {
            uidMessage.textContent = 'Please enter a Free Fire UID.';
            return;
        }
        // Check if UID already exists
        const { data: existing, error: checkErr } = await supabaseClient
            .from('users')
            .select('free_fire_uid')
            .eq('free_fire_uid', uid)
            .maybeSingle();
        if (existing) {
            uidMessage.textContent = '❌ This UID is already registered with another account.';
            return;
        }

        uidMessage.textContent = 'Fetching data...';
        fetchUidBtn.disabled = true;

        try {
            const response = await fetch(`http://187.127.175.208:5000/Bmw?uid=${uid}`);
            if (!response.ok) throw new Error('API request failed');
            const data = await response.json();

            const clan = data.clanBasicInfo || {};
            const captain = data.captainBasicInfo || {};

            fetchedUidData = {
                uid: uid,
                clanId: clan.clanId || '',
                clanName: clan.clanName || 'N/A',
                captainId: captain.accountId || '',
                captainNickname: captain.nickname || 'N/A',
                captainLevel: captain.level || 0,
                captainRegion: captain.region || 'N/A'
            };

            previewClanName.textContent = fetchedUidData.clanName;
            previewClanId.textContent = fetchedUidData.clanId;
            previewCaptain.textContent = fetchedUidData.captainNickname;
            previewCaptainLevel.textContent = fetchedUidData.captainLevel;
            previewRegion.textContent = fetchedUidData.captainRegion;
            ffPreviewContainer.style.display = 'block';
            verifyUidBtn.disabled = false;
            uidMessage.textContent = '✅ Verified successfully. Click "Verify & Create Account" to finish.';
            uidMessage.style.color = '#4caf50';

        } catch (err) {
            uidMessage.textContent = '❌ Error fetching UID: ' + err.message;
            uidMessage.style.color = '#ff6b6b';
            ffPreviewContainer.style.display = 'none';
            verifyUidBtn.disabled = true;
        } finally {
            fetchUidBtn.disabled = false;
        }
    });

    // 9. VERIFY & CREATE ACCOUNT
    verifyUidBtn.addEventListener('click', async () => {
        if (!fetchedUidData) {
            uidMessage.textContent = 'Please fetch UID data first.';
            return;
        }

        verifyUidBtn.disabled = true;
        uidMessage.textContent = 'Creating account...';

        try {
            const { name, phone, email, password, referral } = signupData;

            // Create auth user
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { display_name: name, phone_number: phone } }
            });
            if (authError) throw authError;
            const userId = authData.user.id;

            // Insert user profile
            const profile = {
                id: userId,
                email,
                display_name: name,
                phone_number: phone,
                balance: 10,
                winning_cash: 0,
                bonus_cash: 10,
                status: 'active',
                referral_code: Math.random().toString(36).substring(2, 10).toUpperCase(),
                referred_by: null,
                created_at: new Date(),
                total_matches: 0,
                won_matches: 0,
                total_earnings: 0,
                referral_earnings: 0,
                free_fire_uid: fetchedUidData.uid,
                ff_clan_id: fetchedUidData.clanId,
                ff_clan_name: fetchedUidData.clanName,
                ff_captain_id: fetchedUidData.captainId,
                ff_captain_nickname: fetchedUidData.captainNickname,
                ff_captain_level: fetchedUidData.captainLevel,
                ff_captain_region: fetchedUidData.captainRegion,
                ff_verified: true
            };

            const { error: profileError } = await supabaseClient.from('users').insert([profile]);
            if (profileError) throw profileError;

            // Handle referral
            if (referral) {
                const { data: referrer, error: refErr } = await supabaseClient
                    .from('users')
                    .select('id')
                    .eq('referral_code', referral)
                    .single();
                if (!refErr && referrer) {
                    await supabaseClient.from('pending_referrals').insert([{
                        referrer_uid: referrer.id,
                        referred_uid: userId,
                        status: 'pending',
                        timestamp: new Date()
                    }]);
                    await supabaseClient.from('users').update({ referred_by: referrer.id }).eq('id', userId);
                }
            }

            // Auto-login
            const { error: signInError } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (signInError) throw signInError;

            window.location.href = '/user';

        } catch (err) {
            uidMessage.textContent = '❌ Error creating account: ' + err.message;
            uidMessage.style.color = '#ff6b6b';
            verifyUidBtn.disabled = false;
        }
    });

    // 10. LOAD SOCIAL LINKS
    async function loadSocialLinks() {
        const { data, error } = await supabaseClient.from('settings').select('*').limit(1).single();
        if (error || !data) return;
        if (data.telegram_link) telegramLink.href = data.telegram_link;
        if (data.discord_link) discordLink.href = data.discord_link;
        if (data.youtube_link) youtubeLink.href = data.youtube_link;
        if (data.instagram_link) instagramLink.href = data.instagram_link;
    }

    // 11. AUTH STATE LISTENER – redirect if logged in
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session?.user) {
            window.location.href = '/user';
        }
    });

    // 12. INIT
    loadSocialLinks();

    // 13. FEATURE MODAL FUNCTIONS (if any)
    function showDetail(title, desc) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalDesc').innerText = desc;
        document.getElementById('featureModal').style.display = 'flex';
    }
    function closeDetail() {
        document.getElementById('featureModal').style.display = 'none';
    }

    // 14. REVEAL ANIMATIONS (if used)
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    console.log('POPPY ESPORTS landing page loaded successfully.');
</script>
