<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>POPPY ESPORTS – Tournaments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0b0b1a; color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }
        .tournament-card { background: #1a1a2e; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a2a4a; transition: 0.3s; }
        .tournament-card:hover { border-color: #00aaff; box-shadow: 0 0 20px rgba(0,170,255,0.2); }
        .tournament-card h3 { color: #00aaff; }
        .game-icon { width: 40px; height: 40px; border-radius: 50%; object-fit: contain; margin-right: 12px; }
        .btn-join { background: linear-gradient(45deg, #00aaff, #0051ff); border: none; padding: 10px 25px; border-radius: 30px; color: #fff; font-weight: 600; transition: 0.3s; }
        .btn-join:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-join:hover:not(:disabled) { transform: scale(1.05); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; flex-wrap: wrap; }
        .user-info { color: #aaa; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .logout-btn { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
        .section-title { color: #fff; margin-bottom: 20px; }
        .no-tournaments { color: #666; text-align: center; padding: 40px; }
        .referral-banner { background: #1a1a2e; padding: 15px; border-radius: 12px; border-left: 4px solid #00ff88; margin-bottom: 20px; }
        .referral-banner strong { color: #00ff88; }
        .slots-remaining { background: #2a2a4a; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; }
        .slots-full { color: #ff4444; }
        .ff-verified-badge { background: #1a1a2e; padding: 8px 16px; border-radius: 20px; border-left: 3px solid #00ff88; display: inline-block; margin-bottom: 10px; }
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <img src="POPPY_ESPORTS.png" alt="Logo" style="height: 40px; border-radius: 50%;">
            <span style="font-weight: 700; margin-left: 10px;">POPPY ESPORTS</span>
        </div>
        <div class="user-info">
            <span id="userNameDisplay">User</span> | <span id="userBalance">₹0</span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- Verified UID & Clan -->
    <div class="ff-verified-badge" id="ffBadge">
        <i class="bi bi-check-circle-fill" style="color: #00ff88;"></i>
        Verified UID: <strong id="ffUidDisplay">----</strong> | Clan: <span id="ffClanDisplay">----</span>
    </div>

    <!-- Referral Banner -->
    <div class="referral-banner">
        <i class="bi bi-gift-fill" style="color: #00ff88;"></i>
        Refer & Earn: <strong>₹10</strong> per referral + <strong>10%</strong> of their spending! Your code: <strong id="referralCodeDisplay">----</strong>
    </div>

    <h2 class="section-title">🔥 Latest Incoming Tournaments</h2>
    <div id="tournamentsContainer">
        <div class="loading">Loading tournaments...</div>
    </div>

    <!-- ======== SCRIPTS ======== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ================================================================
        // POPPY ESPORTS – User Dashboard (Fixed supabaseClient)
        // ================================================================

        // 1. CONFIG
        const SUPABASE_URL = 'https://ozfrhmbtgjquagxbinjv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96ZnJobWJ0Z2pxdWFneGJpbmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Mjg1NTQsImV4cCI6MjEwMTIwNDU1NH0.aUvqIJ4vyiWfgR96dscEFNL1xyoHeCtOUlZCRqN_YiI';

        // 2. INIT SUPABASE – use unique name
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. STATE
        let currentUser = null;
        let userProfile = null;

        // 4. DOM REFS
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userBalance = document.getElementById('userBalance');
        const referralCodeDisplay = document.getElementById('referralCodeDisplay');
        const tournamentsContainer = document.getElementById('tournamentsContainer');
        const logoutBtn = document.getElementById('logoutBtn');
        const ffUidDisplay = document.getElementById('ffUidDisplay');
        const ffClanDisplay = document.getElementById('ffClanDisplay');
        const ffBadge = document.getElementById('ffBadge');

        // 5. AUTH STATE LISTENER
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            const user = session?.user || null;
            if (user) {
                currentUser = user;
                // Fetch profile
                const { data: profile, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('id', user.id)
                    .single();
                if (error) {
                    alert('Error loading profile. Please login again.');
                    supabaseClient.auth.signOut();
                    window.location.href = '/';
                    return;
                }
                userProfile = profile;
                // Update UI
                userNameDisplay.textContent = profile.display_name || user.email;
                userBalance.textContent = '₹' + (profile.balance || 0);
                referralCodeDisplay.textContent = profile.referral_code || 'N/A';
                // UID & Clan
                if (profile.free_fire_uid) {
                    ffUidDisplay.textContent = profile.free_fire_uid;
                    ffClanDisplay.textContent = profile.ff_clan_name || 'N/A';
                } else {
                    ffBadge.style.display = 'none';
                }
                // Load tournaments
                loadUpcomingTournaments();
            } else {
                // Not logged in – redirect to landing
                window.location.href = '/';
            }
        });

        // 6. LOAD TOURNAMENTS
        async function loadUpcomingTournaments() {
            const { data: tournaments, error } = await supabaseClient
                .from('tournaments')
                .select('*, games(name, image_url)')
                .eq('status', 'upcoming')
                .order('start_time', { ascending: true })
                .limit(10);

            if (error) {
                tournamentsContainer.innerHTML = `<div class="no-tournaments">Error loading tournaments.</div>`;
                return;
            }

            if (!tournaments || tournaments.length === 0) {
                tournamentsContainer.innerHTML = `<div class="no-tournaments">No upcoming tournaments at the moment. Stay tuned!</div>`;
                return;
            }

            let html = '';
            for (const t of tournaments) {
                const start = new Date(t.start_time).toLocaleString();
                const gameName = t.games?.name || 'Free Fire';
                const gameIcon = t.games?.image_url || 'https://i.ibb.co/4Z5hPVzp/20250418-150058.jpg';
                const entryFee = t.entry_fee || 0;
                const prizePool = t.prize_pool || 0;
                const maxPlayers = t.max_players || 0;
                const registeredCount = t.registered_players ? Object.keys(t.registered_players).length : 0;
                const slotsLeft = maxPlayers > 0 ? maxPlayers - registeredCount : '∞';
                const isFull = maxPlayers > 0 && slotsLeft <= 0;
                const isJoined = userProfile?.joined_tournaments && userProfile.joined_tournaments[t.id];

                html += `
                    <div class="tournament-card">
                        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                            <div style="display: flex; align-items: center;">
                                <img src="${gameIcon}" alt="${gameName}" class="game-icon">
                                <h3>${t.name}</h3>
                            </div>
                            <div>
                                <span class="slots-remaining ${isFull ? 'slots-full' : ''}">
                                    <i class="bi bi-people"></i> ${isFull ? 'Full' : slotsLeft + ' slots left'}
                                </span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin: 10px 0;">
                            <span><i class="bi bi-calendar-event"></i> ${start}</span>
                            <span><i class="bi bi-trophy"></i> Prize: ₹${prizePool}</span>
                            <span><i class="bi bi-currency-rupee"></i> Entry: ₹${entryFee}</span>
                            <span><i class="bi bi-controller"></i> ${t.mode || 'Solo'}</span>
                        </div>
                        ${isJoined ? '<span style="color: #00ff88;">✔ Joined</span>' :
                          (isFull ? '<span style="color: #ff4444;">FULL</span>' :
                          `<button class="btn-join" data-id="${t.id}" data-fee="${entryFee}">Join Tournament</button>`)}
                    </div>
                `;
            }
            tournamentsContainer.innerHTML = html;

            // Attach join handlers
            document.querySelectorAll('.btn-join').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.dataset.id;
                    const fee = parseFloat(btn.dataset.fee);
                    await joinTournament(id, fee);
                });
            });
        }

        // 7. JOIN TOURNAMENT
        async function joinTournament(tournamentId, fee) {
            if (!currentUser) return;
            if ((userProfile.balance || 0) < fee) {
                alert('Insufficient balance. Please recharge.');
                return;
            }

            // Check slots
            const { data: t, error: tError } = await supabaseClient
                .from('tournaments')
                .select('max_players, registered_players')
                .eq('id', tournamentId)
                .single();
            if (tError || !t) {
                alert('Tournament not found.');
                return;
            }
            const registeredCount = t.registered_players ? Object.keys(t.registered_players).length : 0;
            const maxPlayers = t.max_players || 0;
            if (maxPlayers > 0 && registeredCount >= maxPlayers) {
                alert('Tournament is full.');
                return;
            }

            try {
                const newBalance = userProfile.balance - fee;
                const joined = { ...(userProfile.joined_tournaments || {}), [tournamentId]: true };

                const { error: updateUserErr } = await supabaseClient
                    .from('users')
                    .update({ balance: newBalance, joined_tournaments: joined })
                    .eq('id', currentUser.id);
                if (updateUserErr) throw updateUserErr;

                const { error: regErr } = await supabaseClient
                    .from('registered_players')
                    .insert([{
                        tournament_id: tournamentId,
                        user_id: currentUser.id,
                        username: userProfile.display_name,
                        game_uid: userProfile.game_uid || '',
                        joined_at: new Date()
                    }]);
                if (regErr) throw regErr;

                await supabaseClient.from('transactions').insert([{
                    user_id: currentUser.id,
                    type: 'tournament_join',
                    amount: -fee,
                    description: `Joined tournament ${tournamentId}`,
                    timestamp: new Date(),
                    balance_after: newBalance
                }]);

                userProfile.balance = newBalance;
                userProfile.joined_tournaments = joined;
                userBalance.textContent = '₹' + newBalance;

                alert('Joined successfully!');
                loadUpcomingTournaments();
            } catch (err) {
                alert('Error joining: ' + err.message);
            }
        }

        // 8. LOGOUT
        logoutBtn.addEventListener('click', () => {
            supabaseClient.auth.signOut();
            window.location.href = '/';
        });
    </script>
</body>
</html>
