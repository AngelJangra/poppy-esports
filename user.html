<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POPPY ESPORTS – Tournaments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* (same styles – unchanged) */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            padding: 16px 16px 30px;
            background: linear-gradient(-45deg, #0a0a1a, #1a1a3e, #0d0d2b, #1a0a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 16px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand img {
            height: 40px;
            border-radius: 50%;
            border: 2px solid #00aaff;
        }
        .brand span {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }
        .user-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .user-actions .user-name {
            color: #aaa;
            font-size: 0.9rem;
        }
        .user-actions .balance {
            color: #00ff88;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .btn-outline.danger { border-color: #ff6b6b; color: #ff6b6b; }
        .btn-outline.danger:hover { background: #ff6b6b; color: #fff; }
        .ff-badge {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 8px 18px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            margin-bottom: 16px;
            width: 100%;
            animation: fadeInUp 0.6s ease;
        }
        .ff-badge .badge-icon { color: #00ff88; }
        .ff-badge .uid { color: #fff; font-weight: 600; }
        .ff-badge .nickname { color: #00aaff; font-weight: 600; }
        .ff-badge .clan { color: #888; }
        .referral-banner {
            background: linear-gradient(135deg, rgba(0,255,136,0.08), rgba(0,170,255,0.08));
            border: 1px solid rgba(0,255,136,0.15);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease;
        }
        .referral-banner i { color: #00ff88; font-size: 1.4rem; }
        .referral-banner .text {
            flex: 1;
            font-size: 0.9rem;
            color: #ccc;
        }
        .referral-banner .text strong { color: #00ff88; }
        .referral-banner .code {
            background: rgba(0,0,0,0.3);
            padding: 4px 14px;
            border-radius: 30px;
            font-family: monospace;
            font-weight: 700;
            color: #fff;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 24px 0 16px;
        }
        .tournament-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            transition: 0.3s;
            animation: fadeInUp 0.6s ease;
        }
        .tournament-card:hover {
            border-color: #00aaff;
            box-shadow: 0 8px 32px rgba(0,170,255,0.1);
        }
        .tournament-card .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .tournament-card .game {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tournament-card .game img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .tournament-card .game h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #00aaff;
            margin: 0;
        }
        .tournament-card .slots {
            font-size: 0.8rem;
            background: rgba(255,255,255,0.06);
            padding: 4px 12px;
            border-radius: 30px;
        }
        .tournament-card .slots.full { color: #ff6b6b; }
        .tournament-card .details {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 12px 0;
            font-size: 0.85rem;
            color: #aaa;
        }
        .tournament-card .details i { margin-right: 4px; }
        .tournament-card .join-btn {
            background: linear-gradient(135deg, #00aaff, #0051ff);
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 16px rgba(0,170,255,0.3);
        }
        .tournament-card .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .tournament-card .join-btn:active { transform: scale(0.95); }
        .tournament-card .status-joined { color: #00ff88; font-weight: 600; }
        .tournament-card .status-full { color: #ff6b6b; font-weight: 600; }
        .no-tournaments {
            text-align: center;
            padding: 40px 0;
            color: #666;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="brand">
            <img src="POPPY_ESPORTS.png" alt="Logo">
            <span>POPPY ESPORTS</span>
        </div>
        <div class="user-actions">
            <span class="user-name" id="userNameDisplay">User</span>
            <span class="balance" id="userBalance">₹0</span>
            <button class="btn-outline danger" id="deleteAccountBtn">Delete</button>
            <button class="btn-outline" id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- FF Badge -->
    <div class="ff-badge" id="ffBadge">
        <span class="badge-icon"><i class="bi bi-check-circle-fill"></i></span>
        <span class="uid">UID: <strong id="ffUidDisplay">----</strong></span>
        <span class="nickname">Nickname: <span id="ffNicknameDisplay">----</span></span>
        <span class="clan">Clan: <span id="ffClanDisplay">N/A</span></span>
    </div>

    <!-- Referral Banner -->
    <div class="referral-banner">
        <i class="bi bi-gift-fill"></i>
        <span class="text">Refer & Earn: <strong>₹10</strong> per referral + <strong>10%</strong> of their spending!</span>
        <span class="code" id="referralCodeDisplay">----</span>
    </div>

    <!-- Tournaments -->
    <div class="section-title">🔥 Latest Incoming Tournaments</div>
    <div id="tournamentsContainer">
        <div class="loading">Loading tournaments...</div>
    </div>

    <!-- ======== SCRIPTS ======== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ================================================================
        // POPPY ESPORTS – User Dashboard (Strict ID‑based profile)
        // ================================================================

        const SUPABASE_URL = 'https://ozfrhmbtgjquagxbinjv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96ZnJobWJ0Z2pxdWFneGJpbmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Mjg1NTQsImV4cCI6MjEwMTIwNDU1NH0.aUvqIJ4vyiWfgR96dscEFNL1xyoHeCtOUlZCRqN_YiI';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;

        // DOM refs
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userBalance = document.getElementById('userBalance');
        const referralCodeDisplay = document.getElementById('referralCodeDisplay');
        const tournamentsContainer = document.getElementById('tournamentsContainer');
        const logoutBtn = document.getElementById('logoutBtn');
        const deleteBtn = document.getElementById('deleteAccountBtn');
        const ffUidDisplay = document.getElementById('ffUidDisplay');
        const ffNicknameDisplay = document.getElementById('ffNicknameDisplay');
        const ffClanDisplay = document.getElementById('ffClanDisplay');
        const ffBadge = document.getElementById('ffBadge');

        // ============ STRICT PROFILE LOOKUP (by ID only) ============
        async function ensureProfile(user) {
            // Only look up by the user's unique ID
            const { data: profile, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', user.id)
                .maybeSingle();

            if (profile) return profile;

            // No profile found – create one (but this should never happen if signup worked)
            console.warn('Profile missing for user:', user.id, '– creating one now.');
            const displayName = user.user_metadata?.display_name || user.email?.split('@')[0] || 'User';
            const phone = user.user_metadata?.phone_number || '';

            const newProfile = {
                id: user.id,
                email: user.email,
                display_name: displayName,
                phone_number: phone,
                balance: 10,
                winning_cash: 0,
                bonus_cash: 10,
                status: 'active',
                referral_code: Math.random().toString(36).substring(2, 10).toUpperCase(),
                referred_by: null,
                created_at: new Date(),
                total_matches: 0,
                won_matches: 0,
                total_earnings: 0,
                referral_earnings: 0,
                free_fire_uid: null,
                ff_nickname: null,
                ff_clan_id: null,
                ff_clan_name: null,
                ff_captain_id: null,
                ff_captain_nickname: null,
                ff_captain_level: null,
                ff_captain_region: null,
                ff_verified: false,
                joined_tournaments: {},
                total_referred_spending: 0,
                referral_earnings_from_spending: 0,
                deleted: false
            };

            const { error: insertError } = await supabaseClient.from('users').insert([newProfile]);
            if (insertError) {
                console.error('Failed to create missing profile:', insertError);
                // Sign out and force re‑signup
                await supabaseClient.auth.signOut();
                window.location.href = '/';
                return null;
            }

            // Fetch the newly created profile
            const { data: newData } = await supabaseClient.from('users').select('*').eq('id', user.id).single();
            return newData;
        }

        // ============ PERMANENT DELETE via API ============
        deleteBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            if (!confirm('⚠️ Are you sure you want to permanently delete your account? All data will be erased and you cannot recover it!')) return;

            try {
                deleteBtn.disabled = true;
                deleteBtn.textContent = 'Deleting...';

                const response = await fetch('/api/delete-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to delete account');
                }

                await supabaseClient.auth.signOut();
                window.location.href = '/';
            } catch (err) {
                console.error('Delete account error:', err);
                alert('Error deleting account: ' + err.message);
                deleteBtn.disabled = false;
                deleteBtn.textContent = 'Delete';
            }
        });

        // ============ AUTH STATE ============
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            const user = session?.user || null;
            if (user) {
                currentUser = user;
                try {
                    userProfile = await ensureProfile(user);
                    if (!userProfile) return; // ensureProfile signs out on failure

                    // If deleted flag is somehow true (soft delete fallback)
                    if (userProfile.deleted === true) {
                        await supabaseClient.auth.signOut();
                        window.location.href = '/';
                        return;
                    }

                    userNameDisplay.textContent = userProfile.display_name || user.email;
                    userBalance.textContent = '₹' + (userProfile.balance || 0);
                    referralCodeDisplay.textContent = userProfile.referral_code || 'N/A';

                    if (userProfile.free_fire_uid) {
                        ffUidDisplay.textContent = userProfile.free_fire_uid;
                        ffNicknameDisplay.textContent = userProfile.ff_nickname || 'N/A';
                        ffClanDisplay.textContent = userProfile.ff_clan_name || 'N/A';
                    } else {
                        ffBadge.style.display = 'none';
                    }

                    loadUpcomingTournaments();
                } catch (err) {
                    console.error('Profile error:', err);
                    alert('Error loading profile. Please try again.');
                    await supabaseClient.auth.signOut();
                    window.location.href = '/';
                }
            } else {
                window.location.href = '/';
            }
        });

        // ============ LOAD TOURNAMENTS ============
        async function loadUpcomingTournaments() {
            const { data: tournaments, error } = await supabaseClient
                .from('tournaments')
                .select('*, games(name, image_url)')
                .eq('status', 'upcoming')
                .order('start_time', { ascending: true })
                .limit(10);

            if (error) {
                tournamentsContainer.innerHTML = `<div class="no-tournaments">Error loading tournaments.</div>`;
                return;
            }

            if (!tournaments || tournaments.length === 0) {
                tournamentsContainer.innerHTML = `<div class="no-tournaments">No upcoming tournaments at the moment. Stay tuned!</div>`;
                return;
            }

            let html = '';
            for (const t of tournaments) {
                const start = new Date(t.start_time).toLocaleString();
                const gameName = t.games?.name || 'Free Fire';
                const gameIcon = t.games?.image_url || 'https://i.ibb.co/4Z5hPVzp/20250418-150058.jpg';
                const entryFee = t.entry_fee || 0;
                const prizePool = t.prize_pool || 0;
                const maxPlayers = t.max_players || 0;
                const registeredCount = t.registered_players ? Object.keys(t.registered_players).length : 0;
                const slotsLeft = maxPlayers > 0 ? maxPlayers - registeredCount : '∞';
                const isFull = maxPlayers > 0 && slotsLeft <= 0;
                const isJoined = userProfile?.joined_tournaments && userProfile.joined_tournaments[t.id];

                html += `
                    <div class="tournament-card">
                        <div class="top">
                            <div class="game">
                                <img src="${gameIcon}" alt="${gameName}">
                                <h3>${t.name}</h3>
                            </div>
                            <div class="slots ${isFull ? 'full' : ''}">
                                <i class="bi bi-people"></i> ${isFull ? 'Full' : slotsLeft + ' slots left'}
                            </div>
                        </div>
                        <div class="details">
                            <span><i class="bi bi-calendar-event"></i> ${start}</span>
                            <span><i class="bi bi-trophy"></i> ₹${prizePool}</span>
                            <span><i class="bi bi-currency-rupee"></i> ₹${entryFee}</span>
                            <span><i class="bi bi-controller"></i> ${t.mode || 'Solo'}</span>
                        </div>
                        ${isJoined ? '<div class="status-joined">✔ Joined</div>' :
                          (isFull ? '<div class="status-full">FULL</div>' :
                          `<button class="join-btn" data-id="${t.id}" data-fee="${entryFee}">Join Tournament</button>`)}
                    </div>
                `;
            }
            tournamentsContainer.innerHTML = html;

            document.querySelectorAll('.join-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.dataset.id;
                    const fee = parseFloat(btn.dataset.fee);
                    await joinTournament(id, fee);
                });
            });
        }

        // ============ JOIN TOURNAMENT ============
        async function joinTournament(tournamentId, fee) {
            if (!currentUser) return;
            if ((userProfile.balance || 0) < fee) {
                alert('Insufficient balance. Please recharge.');
                return;
            }

            const { data: t, error: tError } = await supabaseClient
                .from('tournaments')
                .select('max_players, registered_players')
                .eq('id', tournamentId)
                .single();
            if (tError || !t) {
                alert('Tournament not found.');
                return;
            }
            const registeredCount = t.registered_players ? Object.keys(t.registered_players).length : 0;
            const maxPlayers = t.max_players || 0;
            if (maxPlayers > 0 && registeredCount >= maxPlayers) {
                alert('Tournament is full.');
                return;
            }

            try {
                const newBalance = userProfile.balance - fee;
                const joined = { ...(userProfile.joined_tournaments || {}), [tournamentId]: true };

                const { error: updateUserErr } = await supabaseClient
                    .from('users')
                    .update({ balance: newBalance, joined_tournaments: joined })
                    .eq('id', currentUser.id);
                if (updateUserErr) throw updateUserErr;

                const { error: regErr } = await supabaseClient
                    .from('registered_players')
                    .insert([{
                        tournament_id: tournamentId,
                        user_id: currentUser.id,
                        username: userProfile.display_name,
                        game_uid: userProfile.game_uid || '',
                        joined_at: new Date()
                    }]);
                if (regErr) throw regErr;

                await supabaseClient.from('transactions').insert([{
                    user_id: currentUser.id,
                    type: 'tournament_join',
                    amount: -fee,
                    description: `Joined tournament ${tournamentId}`,
                    timestamp: new Date(),
                    balance_after: newBalance
                }]);

                userProfile.balance = newBalance;
                userProfile.joined_tournaments = joined;
                userBalance.textContent = '₹' + newBalance;

                alert('Joined successfully!');
                loadUpcomingTournaments();
            } catch (err) {
                alert('Error joining: ' + err.message);
            }
        }

        // ============ LOGOUT ============
        logoutBtn.addEventListener('click', async () => {
            try {
                logoutBtn.disabled = true;
                logoutBtn.textContent = 'Logging out...';
                await supabaseClient.auth.signOut();
                window.location.href = '/';
            } catch (err) {
                console.error('Logout error:', err);
                alert('Failed to logout. Please try again.');
                logoutBtn.disabled = false;
                logoutBtn.textContent = 'Logout';
            }
        });
    </script>
</body>
</html>
